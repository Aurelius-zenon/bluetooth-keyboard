name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'www/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，直接接受许可即可，不用 setup-android
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Install deps and sync web assets
        run: |
          npm ci
          npm run sync

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build.log 2>&1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: touch-keyboard-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 失败时把日志发到公开粘贴站，便于无 token 排查
      - name: Publish log
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 80000 build.log > ci.log
          URL=$(curl -s --data-binary @ci.log https://paste.rs || true)
          echo "LOG_URL=$URL"
          exit 1
