name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-twa/twa-manifest.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: bluetoothkeyboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build (traced)
        id: twabuild
        continue-on-error: true
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          exec > >(tee ci-build.log) 2>&1
          set -x
          echo "=== env ==="
          java -version || true
          npm -v || true
          node -v || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -d /usr/local/lib/android/sdk 2>/dev/null || true

          echo "=== install bubblewrap ==="
          npm install -g @bubblewrap/cli
          bubblewrap --version || true

          echo "=== configure ==="
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

          echo "=== keystore ==="
          cd android-twa
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Bluetooth Keyboard, OU=App, O=Personal, L=NA, ST=NA, C=CN"
          fi
          keytool -list -v -keystore android.keystore -alias android -storepass "$KS_PASS" | grep SHA256

          echo "=== assetlinks ==="
          FP=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KS_PASS" | grep SHA256 | head -1 | sed 's/.*SHA256: //' | tr -d ' ')
          echo "FP=$FP"
          cd ..
          mkdir -p .well-known
          printf '[\n  {\n    "relation": ["delegate_permission/common.handle_all_urls"],\n    "target": {\n      "namespace": "android_app",\n      "package_name": "com.bluetoothkeyboard.app",\n      "sha256_cert_fingerprints": ["%s"]\n    }\n  }\n]\n' "$FP" > .well-known/assetlinks.json

          echo "=== build ==="
          cd android-twa
          bubblewrap build --skipPwaValidation

          echo "=== outputs ==="
          ls -la *.apk *.aab || true

      - name: Persist trace and artifacts
        if: always()
        run: |
          [ -f ci-build.log ] || echo "no trace" > ci-build.log
          cp ci-build.log build-failure.log
          cp android-twa/build.log android-twa-build.log 2>/dev/null || true
          mkdir -p .well-known
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-failure.log android-twa-build.log .well-known/assetlinks.json android-twa/android.keystore 2>/dev/null || true
          git commit -m "ci: 构建追踪日志" || true
          git push || true
          echo "--- last 60 lines ---"
          tail -n 60 ci-build.log || true

      - name: Upload APK artifact
        if: steps.twabuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-keyboard-apk
          path: |
            android-twa/*.apk
            android-twa/*.aab

      - name: Publish Release
        if: steps.twabuild.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 蓝牙键盘 APK r${{ github.run_number }}
          body: |
            平板蓝牙键盘 Android 安装包（TWA 封装）
            安装后从桌面「蓝牙键盘」图标启动，横屏全屏运行。
          files: android-twa/*.apk
# trigger 1
