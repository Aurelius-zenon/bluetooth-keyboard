name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-twa/twa-manifest.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: bluetoothkeyboard
      BUBBLEWRAP_KEY_PASSWORD: bluetoothkeyboard
      JAVA_HOME: ${{ env.JAVA_HOME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build TWA
        working-directory: android-twa
        run: |
          echo "sdk.dir=$ANDROID_HOME" > /tmp/sdk.txt
          yes | bubblewrap build --skipPwaValidation || bubblewrap build --skipPwaValidation

      - name: List outputs
        run: ls -la android-twa/*.apk android-twa/*.aab || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-keyboard-apk
          path: |
            android-twa/*.apk
            android-twa/*.aab

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 蓝牙键盘 APK r${{ github.run_number }}
          body: |
            平板蓝牙键盘 Android 安装包（TWA 封装）
            安装后从桌面「蓝牙键盘」图标启动，横屏全屏运行。
          files: android-twa/*.apk
