name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-twa/twa-manifest.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: bluetoothkeyboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnostics
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head -20

      - name: Ensure signing keystore
        working-directory: android-twa
        run: |
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v \
              -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Bluetooth Keyboard, OU=App, O=Personal, L=NA, ST=NA, C=CN"
          fi
          keytool -list -v -keystore android.keystore -alias android -storepass "$KS_PASS" | grep "SHA256:" | head -1

      - name: Sync assetlinks fingerprint
        run: |
          FP=$(keytool -list -v -keystore android-twa/android.keystore -alias android -storepass "$KS_PASS" \
               | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' ')
          echo "Fingerprint: $FP"
          mkdir -p .well-known
          cat > .well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.bluetoothkeyboard.app",
                "sha256_cert_fingerprints": ["$FP"]
              }
            }
          ]
          EOF
          cat .well-known/assetlinks.json

      - name: Commit keystore and assetlinks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f android-twa/android.keystore .well-known/assetlinks.json
          git diff --staged --quiet || git commit -m "ci: 持久化签名密钥与 assetlinks"
          git push

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli && bubblewrap --version

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Build TWA
        id: twabuild
        working-directory: android-twa
        continue-on-error: true
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          bubblewrap build --skipPwaValidation 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Publish build log on failure
        if: steps.twabuild.outcome == 'failure'
        run: |
          cp android-twa/build.log build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-failure.log
          git commit -m "ci: 记录 APK 构建失败日志" || true
          git push || true

      - name: List outputs
        if: always()
        run: ls -la android-twa/*.apk android-twa/*.aab || true

      - name: Upload APK artifact
        if: steps.twabuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-keyboard-apk
          path: |
            android-twa/*.apk
            android-twa/*.aab

      - name: Publish Release
        if: steps.twabuild.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 蓝牙键盘 APK r${{ github.run_number }}
          body: |
            平板蓝牙键盘 Android 安装包（TWA 封装）
            安装后从桌面「蓝牙键盘」图标启动，横屏全屏运行。
          files: android-twa/*.apk
