<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#2B8FFF">
<title>触屏键盘</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --bg:#F2F4F7;
    --panel:#FFFFFF;
    --key:#FFFFFF;
    --keyFn:#E6EAF0;
    --text:#1B1F24;
    --textFn:#5A6472;
    --accent:#2B8FFF;
    --accentSoft:#E3F0FF;
    --border:#DFE4EC;
    --shadow:0 1px 2px rgba(20,30,50,.10);
    --fs-letter:clamp(15px, 2.5vh, 30px);
    --fs-fn:clamp(9px, 1.4vh, 15px);
  }
  [data-theme="dark"]{
    --bg:#15181D;
    --panel:#1E222A;
    --key:#2A2F39;
    --keyFn:#22262F;
    --text:#EDF1F7;
    --textFn:#9AA5B5;
    --accent:#3D9BFF;
    --accentSoft:#1D3B5C;
    --border:#2F3541;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }
  [data-theme="sand"]{
    --bg:#F4EFE4;
    --panel:#FBF7EE;
    --key:#FFFDF8;
    --keyFn:#EFE7D6;
    --text:#3A3226;
    --textFn:#8A7B62;
    --accent:#C08A3E;
    --accentSoft:#F5E9D4;
    --border:#E4D9C4;
    --shadow:0 1px 2px rgba(120,100,70,.14);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;touch-action:manipulation;
  }

  /* ---------- 顶栏 ---------- */
  header{
    flex:0 0 auto;
    display:flex;align-items:center;gap:10px;
    padding:calc(6px + env(safe-area-inset-top)) 14px 6px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--textFn);min-width:0;}
  .dot{width:8px;height:8px;border-radius:50%;background:#B9C2CF;flex:0 0 auto;transition:background .2s;}
  .dot.ok{background:#28C76F;box-shadow:0 0 0 4px rgba(40,199,111,.16);}
  .dot.err{background:#FF5A5F;}
  .status span#st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    border:1px solid var(--border);background:var(--key);color:var(--text);
    height:34px;padding:0 12px;border-radius:17px;font-size:13px;
    display:flex;align-items:center;gap:6px;
  }
  .iconbtn:active{transform:translateY(1px);}

  /* ---------- 键盘 ---------- */
  #kb{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .row{display:flex;gap:6px;flex:1 1 0;min-height:0;}
  .row.fnrow{flex:.8 1 0;}

  .key{
    flex:1 1 0;min-width:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:var(--key);color:var(--text);
    border-radius:10px;border:1px solid var(--border);
    box-shadow:var(--shadow);
    font-size:var(--fs-letter);font-weight:600;line-height:1;
    transition:transform .05s ease, background .12s ease;
    overflow:hidden;
  }
  .key.fn{
    background:var(--keyFn);color:var(--textFn);
    font-size:var(--fs-fn);font-weight:500;
  }
  .key.wide{font-size:calc(var(--fs-fn) * 1.05);}
  .key.on{
    background:var(--accent);color:#fff;border-color:transparent;
    box-shadow:0 0 0 2px var(--accentSoft) inset;
  }
  .key.pressed{transform:translateY(1.5px) scale(.995);filter:brightness(.95);}
  .key .sub{
    position:absolute;top:3px;left:6px;
    font-size:calc(var(--fs-fn) * .82);font-weight:400;color:var(--textFn);opacity:.75;
  }
  .key .lbl{padding:0 4px;text-align:center;}

  /* ---------- 设置面板 ---------- */
  dialog{
    border:none;border-radius:16px;padding:0;background:var(--panel);color:var(--text);
    width:min(420px, 88vw);box-shadow:0 20px 60px rgba(0,0,0,.28);
  }
  dialog::backdrop{background:rgba(10,14,20,.45);backdrop-filter:blur(3px);}
  .dlg{padding:18px 18px 14px;}
  .dlg h3{margin:0 0 14px;font-size:16px;font-weight:600;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--textFn);margin-bottom:6px;}
  .field input{
    width:100%;height:42px;padding:0 12px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg);color:var(--text);
    font-size:14px;outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .themes{display:flex;gap:8px;}
  .theme-opt{
    flex:1;height:40px;border-radius:10px;border:2px solid var(--border);
    font-size:13px;background:var(--key);color:var(--text);
  }
  .theme-opt.active{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .dlg-actions{display:flex;gap:8px;margin-top:16px;}
  .btn{
    flex:1;height:44px;border-radius:11px;border:none;font-size:14px;font-weight:600;
    background:var(--keyFn);color:var(--text);
  }
  .btn.primary{background:var(--accent);color:#fff;}
  .btn:active{transform:translateY(1px);}
  .winlist{max-height:38vh;overflow:auto;margin-top:8px;}
  .winitem{
    display:block;width:100%;text-align:left;
    padding:10px 12px;margin-bottom:6px;border-radius:9px;
    border:1px solid var(--border);background:var(--key);color:var(--text);
    font-size:13px;line-height:1.35;
  }
  .winitem:active{transform:translateY(1px);}
  .hint{font-size:11.5px;line-height:1.6;color:var(--textFn);margin-top:10px;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    background:rgba(24,28,34,.92);color:#fff;
    padding:8px 16px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .18s ease;max-width:80vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* 窄高屏微调 */
  @media (max-height:520px){
    header{padding-top:calc(3px + env(safe-area-inset-top));padding-bottom:3px;}
    #kb{gap:4px;padding:5px 7px calc(5px + env(safe-area-inset-bottom));}
    .row{gap:4px;}
    .key{border-radius:7px;}
  }
</style>
</head>
<body>

<header>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="st">检测桥接…</span>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnFn">Fn</button>
  <button class="iconbtn" id="btnTheme">主题</button>
  <button class="iconbtn" id="btnSet">设置</button>
</header>

<main id="kb"></main>

<dialog id="dlg">
  <div class="dlg">
    <h3>设置</h3>
    <div class="field">
      <label>桥接地址（电脑上运行 bridge.py）</label>
      <input id="inBase" placeholder="http://192.168.1.10:8888" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label>目标程序（锁定后每次按键前自动切到它，不依赖谁抢焦点）</label>
      <button class="btn" id="btnPickWin" style="width:100%">选择目标窗口</button>
      <div id="winList" class="winlist"></div>
    </div>
    <div class="field">
      <label>主题</label>
      <div class="themes">
        <button class="theme-opt" data-theme="light">亮色</button>
        <button class="theme-opt" data-theme="dark">深色</button>
        <button class="theme-opt" data-theme="sand">米色</button>
      </div>
    </div>
    <div class="hint">
      平板与电脑连同一个 WiFi。电脑执行 <b>python bridge.py</b>，
      终端会打印「平板打开: http://xxx:8888/」，用平板浏览器打开这个地址即可直接输入。
      APK 内是 https 页面，无法直连 http 桥接，请在浏览器里用上面的地址。
    </div>
    <div class="dlg-actions">
      <button class="btn" id="btnCancel">关闭</button>
      <button class="btn primary" id="btnSave">保存并测试</button>
    </div>
  </div>
</dialog>

<div id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= 键盘布局（ANSI 60%，每行合计 15U） ================= */
  const FROW = [
    {id:'escape', label:'Esc', cls:'fn', w:1.4},
    {id:'f1', label:'F1', cls:'fn'}, {id:'f2', label:'F2', cls:'fn'},
    {id:'f3', label:'F3', cls:'fn'}, {id:'f4', label:'F4', cls:'fn'},
    {id:'f5', label:'F5', cls:'fn'}, {id:'f6', label:'F6', cls:'fn'},
    {id:'f7', label:'F7', cls:'fn'}, {id:'f8', label:'F8', cls:'fn'},
    {id:'f9', label:'F9', cls:'fn'}, {id:'f10', label:'F10', cls:'fn'},
    {id:'f11', label:'F11', cls:'fn'}, {id:'f12', label:'F12', cls:'fn'},
  ];

  const ROWS = [
    [ // 数字行 15U
      {id:'`', label:'`', shift:'~'},
      {id:'1', label:'1', shift:'!'}, {id:'2', label:'2', shift:'@'},
      {id:'3', label:'3', shift:'#'}, {id:'4', label:'4', shift:'$'},
      {id:'5', label:'5', shift:'%'}, {id:'6', label:'6', shift:'^'},
      {id:'7', label:'7', shift:'&'}, {id:'8', label:'8', shift:'*'},
      {id:'9', label:'9', shift:'('}, {id:'0', label:'0', shift:')'},
      {id:'-', label:'-', shift:'_'}, {id:'=', label:'=', shift:'+'},
      {id:'backspace', label:'⌫', cls:'fn wide', w:2},
    ],
    [ // Tab 行 15U
      {id:'tab', label:'Tab', cls:'fn wide', w:1.5},
      {id:'q', label:'Q'}, {id:'w', label:'W'}, {id:'e', label:'E'},
      {id:'r', label:'R'}, {id:'t', label:'T'}, {id:'y', label:'Y'},
      {id:'u', label:'U'}, {id:'i', label:'I'}, {id:'o', label:'O'},
      {id:'p', label:'P'},
      {id:'[', label:'[', shift:'{'},
      {id:']', label:']', shift:'}'},
      {id:'\\', label:'\\', shift:'|', w:1.5},
    ],
    [ // Caps 行 15U
      {id:'caps', label:'Caps', cls:'fn wide', w:1.75, toggle:'caps'},
      {id:'a', label:'A'}, {id:'s', label:'S'}, {id:'d', label:'D'},
      {id:'f', label:'F'}, {id:'g', label:'G'}, {id:'h', label:'H'},
      {id:'j', label:'J'}, {id:'k', label:'K'}, {id:'l', label:'L'},
      {id:';', label:';', shift:':'},
      {id:"'", label:"'", shift:'"'},
      {id:'enter', label:'Enter', cls:'fn wide', w:2.25},
    ],
    [ // Shift 行 15U
      {id:'shift', label:'Shift', cls:'fn wide', w:2.25, toggle:'shift'},
      {id:'z', label:'Z'}, {id:'x', label:'X'}, {id:'c', label:'C'},
      {id:'v', label:'V'}, {id:'b', label:'B'}, {id:'n', label:'N'},
      {id:'m', label:'M'},
      {id:',', label:',', shift:'<'},
      {id:'.', label:'.', shift:'>'},
      {id:'/', label:'/', shift:'?'},
      {id:'shift2', label:'Shift', cls:'fn wide', w:2.75, toggle:'shift'},
    ],
    [ // 底行 15U
      {id:'ctrl', label:'Ctrl', cls:'fn wide', w:1.25, toggle:'ctrl'},
      {id:'win', label:'Win', cls:'fn wide', w:1.25, toggle:'win'},
      {id:'alt', label:'Alt', cls:'fn wide', w:1.25, toggle:'alt'},
      {id:'space', label:'', w:6.25},
      {id:'alt2', label:'Alt', cls:'fn wide', w:1.25, toggle:'alt'},
      {id:'win2', label:'Win', cls:'fn wide', w:1.25, toggle:'win'},
      {id:'delete', label:'Del', cls:'fn wide', w:1.25},
      {id:'ctrl2', label:'Ctrl', cls:'fn wide', w:1.25, toggle:'ctrl'},
    ],
  ];

  /* ================= 状态 ================= */
  const st = {
    mods: {ctrl:false, alt:false, shift:false, win:false},
    caps: false,
    fnRow: localStorage.getItem('kb.fnRow') === '1',
    base: (localStorage.getItem('kb.base') || location.origin).replace(/\/+$/, ''),
    online: false,
  };

  const $ = (s) => document.querySelector(s);
  const kb = $('#kb'), dlg = $('#dlg'), toastEl = $('#toast');

  let toastTimer = 0;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100);
  }

  function haptic(){ try{ navigator.vibrate && navigator.vibrate(7); }catch(e){} }

  /* ================= 渲染 ================= */
  function makeKey(spec){
    const el = document.createElement('div');
    el.className = 'key' + (spec.cls ? ' ' + spec.cls : '');
    el.style.flexGrow = spec.w || 1;
    el.dataset.id = spec.id;
    if (spec.toggle) el.dataset.toggle = spec.toggle;

    if (spec.shift){
      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = spec.shift;
      el.appendChild(sub);
    }
    const lbl = document.createElement('span');
    lbl.className = 'lbl';
    lbl.textContent = spec.label;
    el.appendChild(lbl);
    return el;
  }

  function render(){
    kb.innerHTML = '';
    if (st.fnRow){
      const r = document.createElement('div');
      r.className = 'row fnrow';
      FROW.forEach(k => r.appendChild(makeKey(k)));
      kb.appendChild(r);
    }
    ROWS.forEach(rowKeys => {
      const r = document.createElement('div');
      r.className = 'row';
      rowKeys.forEach(k => r.appendChild(makeKey(k)));
      kb.appendChild(r);
    });
    paintState();
  }

  function paintState(){
    document.querySelectorAll('.key[data-toggle]').forEach(el => {
      const t = el.dataset.toggle;
      const on = t === 'caps' ? st.caps : st.mods[t];
      el.classList.toggle('on', !!on);
    });
    $('#btnFn').style.color = st.fnRow ? 'var(--accent)' : '';
    $('#btnFn').style.borderColor = st.fnRow ? 'var(--accent)' : '';
  }

  /* ================= 发送 ================= */
  function activeMods(){
    return Object.keys(st.mods).filter(m => st.mods[m]);
  }

  function buildCmd(spec){
    let key = spec.id;
    let mods = activeMods();
    const isLetter = /^[a-z]$/.test(key);

    if ((st.mods.shift || (st.caps && isLetter)) && spec.shift){
      key = spec.shift;
      mods = mods.filter(m => m !== 'shift');
    } else if (isLetter && (st.mods.shift || st.caps) && !mods.includes('shift')){
      mods.push('shift');
    }

    const combo = mods.length ? mods.join('+') + '+' + key : null;
    const label = mods.length ? combo.toUpperCase() : (spec.label || key);
    return {key, mods, combo, label: label};
  }

  function send(spec){
    const cmd = buildCmd(spec);
    const url = st.base + '/key';
    try{
      fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(cmd),
        keepalive: true,
        mode: 'cors',
      }).then(r => {
        if (!r.ok) throw new Error(r.status);
        setOnline(true);
      }).catch(() => {
        setOnline(false);
        toast('未连上桥接 · 检查 bridge.py');
      });
    }catch(e){
      setOnline(false);
    }
    toast((spec.label || spec.id) + '  ' + (cmd.combo ? cmd.combo : ''));
  }

  /* ================= 交互 ================= */
  kb.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.key');
    if (!el) return;
    e.preventDefault();

    const id = el.dataset.id;
    const toggle = el.dataset.toggle;

    el.classList.add('pressed');
    setTimeout(() => el.classList.remove('pressed'), 90);
    haptic();

    if (toggle){
      if (toggle === 'caps') st.caps = !st.caps;
      else st.mods[toggle] = !st.mods[toggle];
      paintState();
      return;
    }

    if (id === 'space'){
      send({id:'space', label:'空格'});
      return;
    }

    // 找回对应的 spec
    const spec = findSpec(id);
    if (!spec) return;

    send(spec);

    // 单击后清除一次性修饰键（保留 Caps）
    const hadMods = Object.values(st.mods).some(Boolean);
    if (hadMods){
      Object.keys(st.mods).forEach(m => st.mods[m] = false);
      paintState();
    }
  }, {passive:false});

  kb.addEventListener('contextmenu', e => e.preventDefault());

  function findSpec(id){
    const all = [...FROW, ...ROWS.flat()];
    return all.find(k => k.id === id) || null;
  }

  /* ================= 桥接连通性 ================= */
  function setOnline(ok){
    st.online = ok;
    const dot = $('#dot'), stEl = $('#st');
    dot.classList.toggle('ok', ok);
    dot.classList.toggle('err', !ok);
    stEl.textContent = ok ? ('已连接 · ' + st.base.replace(/^https?:\/\//,'')) : '未连接桥接';
  }

  let pingCtrl = null;
  async function ping(){
    try{
      if (pingCtrl) pingCtrl.abort();
      pingCtrl = new AbortController();
      const t = setTimeout(() => pingCtrl.abort(), 1600);
      const r = await fetch(st.base + '/diag', {signal: pingCtrl.signal, cache:'no-store'});
      clearTimeout(t);
      const d = await r.json();
      setOnline(!!d.ok);
      if (d.ok){
        const last = d.last || {};
        const stEl = $('#st');
        if (d.target && d.target.hwnd){
          stEl.textContent = '已锁定 · ' + shortWin(d.target.title);
        } else if (last.ok === false){
          stEl.textContent = '注入失败 · 错误 ' + (last.err || '?');
        } else if (last.target_window){
          stEl.textContent = '已连接 · 目标：' + shortWin(last.target_window);
        } else {
          stEl.textContent = '已连接 · 当前：' + shortWin(d.foreground || '');
        }
        if (!d.elevated){
          stEl.title = '非管理员运行：无法向管理员权限的程序输入';
        }
      }
    }catch(e){
      setOnline(false);
    }
  }

  function shortWin(t){
    if (!t) return '未知窗口';
    const s = t.replace(/\s*-\s*(Google Chrome|Microsoft Edge|记事本|Notepad).*$/i, '');
    return s.length > 14 ? s.slice(0, 14) + '…' : s;
  }

  /* ================= 设置面板 ================= */
  const inBase = $('#inBase');

  $('#btnSet').addEventListener('click', () => {
    inBase.value = st.base;
    paintThemeButtons();
    dlg.showModal();
  });
  $('#btnCancel').addEventListener('click', () => dlg.close());

  // 选择目标窗口
  $('#btnPickWin').addEventListener('click', async () => {
    const list = $('#winList');
    list.innerHTML = '<div class="hint">读取中…</div>';
    try{
      const r = await fetch(st.base + '/windows', {cache:'no-store'});
      const d = await r.json();
      list.innerHTML = '';
      const off = document.createElement('button');
      off.className = 'winitem';
      off.textContent = '不锁定（跟随当前前台窗口）';
      off.addEventListener('click', async () => {
        await fetch(st.base + '/target', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({hwnd: 0}),
        });
        list.innerHTML = '';
        toast('已取消锁定');
        ping();
      });
      list.appendChild(off);
      (d.windows || []).forEach(w => {
        const b = document.createElement('button');
        b.className = 'winitem';
        b.textContent = w.title;
        b.addEventListener('click', async () => {
          await fetch(st.base + '/target', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({hwnd: w.hwnd}),
          });
          list.innerHTML = '';
          toast('已锁定：' + w.title);
          ping();
        });
        list.appendChild(b);
      });
    }catch(e){
      list.innerHTML = '<div class="hint">读取失败，请确认桥接已连接</div>';
    }
  });
  $('#btnSave').addEventListener('click', () => {
    const v = inBase.value.trim();
    if (v){
      st.base = v.replace(/\/+$/, '');
      localStorage.setItem('kb.base', st.base);
    }
    dlg.close();
    ping();
  });

  /* ================= 主题 ================= */
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    localStorage.setItem('kb.theme', t);
    paintThemeButtons();
  }
  function paintThemeButtons(){
    const cur = localStorage.getItem('kb.theme') || 'light';
    document.querySelectorAll('.theme-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === cur);
    });
  }
  document.querySelectorAll('.theme-opt').forEach(b => {
    b.addEventListener('click', () => applyTheme(b.dataset.theme));
  });
  $('#btnTheme').addEventListener('click', () => {
    const order = ['light','dark','sand'];
    const cur = localStorage.getItem('kb.theme') || 'light';
    applyTheme(order[(order.indexOf(cur) + 1) % order.length]);
  });

  /* ================= Fn 行 ================= */
  $('#btnFn').addEventListener('click', () => {
    st.fnRow = !st.fnRow;
    localStorage.setItem('kb.fnRow', st.fnRow ? '1' : '0');
    render();
  });

  /* ================= 初始化 ================= */
  applyTheme(localStorage.getItem('kb.theme') || 'light');
  render();
  ping();
  setInterval(ping, 5000);

  // HTTP 页面（bridge 托管）默认同源直连
  if (location.protocol === 'http:' && !localStorage.getItem('kb.base')){
    st.base = location.origin;
  }

  // Service Worker（离线缓存 + 可安装）
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
